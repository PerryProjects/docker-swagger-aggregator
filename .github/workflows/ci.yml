name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit of the pull request is signed off (DCO)
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git log -1 --format=%B "$sha" | grep -Eiq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit ${sha:0:10} has no Signed-off-by line (git commit -s, see CONTRIBUTING.md)"
              missing=1
            fi
          done
          exit $missing

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # the small Docker-only API (no client-go) must keep building and passing
      - run: go vet -tags nokubernetes ./...
      - run: go test -tags nokubernetes -count=1 ./internal/app/ ./cmd/...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest # .golangci.yml is a v2 config; pin a version once you want reproducible lint

  # Separate job with the newest Go: vulnerabilities in the standard library are fixed by the toolchain.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    env:
      # PrimeVue 5 licence key (a repository secret, never in the code). Pull requests from forks have no secret: the
      # tests still pass, the UI just shows PrimeVue's "Invalid PrimeUI License" badge.
      VITE_PRIMEVUE_LICENSE: ${{ secrets.PRIMEVUE_LICENSE }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5 # the e2e tests of the built-in auth run the real Go web server
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7 # vue-tsc (typecheck) needs Node, not the Bun runtime
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run bundle
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize deploy/kubernetes > /dev/null # the base renders
      - run: docker compose config -q # the default compose file is valid
      - run: AGGREGATOR_HOST=docs.example.com docker compose -f docker-compose.yml -f docker-compose.traefik.yml config -q

  image:
    needs: [go, web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # full: with Kubernetes support (deploy/kubernetes). docker: the small API without client-go, for Docker setups.
        variant: [full, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=${{ matrix.variant == 'docker' && '-docker' || '' }},onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # No PrimeVue licence key here on purpose: the key ends up in the built JavaScript, and these images are published
          # from a public repository. They show PrimeVue's "Invalid PrimeUI License" badge until you build with your own key.
          build-args: |
            KUBERNETES=${{ matrix.variant == 'full' }}
          push: ${{ github.event_name != 'pull_request' }} # pull requests only prove that it builds
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
