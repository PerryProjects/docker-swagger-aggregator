# GitLab CI. The image is pushed to the project's container registry from the default branch and from tags.
stages: [test, build]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true

variables:
  GOFLAGS: -mod=readonly

dco: # every commit of a merge request is signed off (see CONTRIBUTING.md)
  stage: test
  image: alpine/git:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      missing=0
      for sha in $(git rev-list --no-merges "$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA"); do
        if ! git log -1 --format=%B "$sha" | grep -Eiq '^Signed-off-by: .+ <.+@.+>$'; then
          echo "commit $sha has no Signed-off-by line (git commit -s, see CONTRIBUTING.md)"; missing=1
        fi
      done
      exit $missing

go:
  stage: test
  image: golang:1.27 # has gcc, which -race needs
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths: [.go-cache/]
  variables:
    GOCACHE: $CI_PROJECT_DIR/.go-cache/build
    GOMODCACHE: $CI_PROJECT_DIR/.go-cache/mod
  script:
    - go vet ./...
    - go test -race -count=1 ./...
    # the small Docker-only API (no client-go) must keep building and passing
    - go vet -tags nokubernetes ./...
    - go test -tags nokubernetes -count=1 ./internal/app/ ./cmd/...

lint:
  stage: test
  image: golangci/golangci-lint:latest # .golangci.yml is a v2 config; pin a tag for reproducible lint
  script:
    - golangci-lint run ./...

vulncheck:
  stage: test
  image: golang:1 # newest Go: standard library fixes come with the toolchain
  script:
    - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

web-binary: # the e2e tests of the built-in auth run the real Go web server; the Playwright image has no Go
  stage: test
  image: golang:1.27
  script:
    - CGO_ENABLED=0 go build -o bin/swagger-aggregator-web ./cmd/swagger-aggregator-web
  artifacts:
    paths: [bin/swagger-aggregator-web]
    expire_in: 1 hour

web:
  stage: test
  needs: [web-binary]
  variables:
    E2E_WEB_BIN: $CI_PROJECT_DIR/bin/swagger-aggregator-web
    # PrimeVue 5 licence key: a masked CI/CD variable PRIMEVUE_LICENSE (never in the code). Without it the tests pass and the
    # UI shows PrimeVue's "Invalid PrimeUI License" badge.
    VITE_PRIMEVUE_LICENSE: $PRIMEVUE_LICENSE
  image: mcr.microsoft.com/playwright:v1.64.1-noble # browsers + Node; the tag must match @playwright/test in web/package.json
  cache:
    key:
      files: [web/bun.lock]
    paths: [web/node_modules/]
  before_script:
    - npm install -g bun # vue-tsc needs Node; Bun installs and runs the scripts
    - cd web
    - bun install --frozen-lockfile
  script:
    - bun run typecheck
    - bun run bundle
    - bun run test:e2e
  artifacts:
    when: on_failure
    paths: [web/test-results/]

manifests:
  stage: test
  image: alpine/k8s:1.33.0 # kubectl + kustomize; any recent tag works
  script:
    - kubectl kustomize deploy/kubernetes > /dev/null

image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # only proves that it builds
      variables: {PUSH: "false"}
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
      variables: {PUSH: "true"}
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker run --privileged --rm tonistiigi/binfmt --install arm64 # multi-arch builds under QEMU
    - docker buildx create --use
  script:
    - |
      TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      OUT="--output=type=image,push=$PUSH"
      # two variants: full (Kubernetes support, deploy/kubernetes) and docker (the small API without client-go, suffix -docker)
      for variant in full docker; do
        SUFFIX=""; K8S=true
        if [ "$variant" = docker ]; then SUFFIX="-docker"; K8S=false; fi
        TAGS="-t $CI_REGISTRY_IMAGE:$TAG$SUFFIX"
        if [ -n "$CI_COMMIT_TAG" ]; then TAGS="$TAGS -t $CI_REGISTRY_IMAGE:latest$SUFFIX"; fi
        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then TAGS="$TAGS -t $CI_REGISTRY_IMAGE:main$SUFFIX"; fi
        docker buildx build --platform linux/amd64,linux/arm64 --build-arg KUBERNETES=$K8S \
          --build-arg PRIMEVUE_LICENSE="$PRIMEVUE_LICENSE" $TAGS $OUT .
      done
