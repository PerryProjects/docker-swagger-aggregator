# Demo workloads for the Kubernetes source: kubectl apply -f deploy/kubernetes/demo.yaml
#  - orders:  documented Service + standard Ingress (public URL derived from it)
#  - billing: documented Service + Traefik IngressRoute (public URL derived from it)
# Attributes: the on-switch is a LABEL (selector); values that labels cannot hold (URLs) are ANNOTATIONS.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: specs
  namespace: demo
data:
  orders.json: |
    {"openapi":"3.0.3","info":{"title":"Orders (k8s demo)","version":"1.0.0"},"servers":[{"url":"http://orders.demo.svc:8080"}],
     "paths":{"/orders":{"get":{"summary":"List orders","tags":["orders"],"responses":{"200":{"description":"OK"}}}}}}
  billing.json: |
    {"openapi":"3.0.3","info":{"title":"Billing (k8s demo)","version":"1.0.0"},
     "paths":{"/invoices":{"get":{"summary":"List invoices","tags":["billing"],"responses":{"200":{"description":"OK"}}}}}}
  orders: '[{"id":"o-1","total":42}]'
  invoices: '[{"id":"inv-1","amount":99}]'
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: orders, namespace: demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders}}
  template:
    metadata: {labels: {app: orders}}
    spec:
      containers:
        - name: httpd
          image: busybox:1.37
          command: [sh, -c, "mkdir -p /www && cp /specs/orders.json /www/openapi.json && cp /specs/orders /www/orders && exec httpd -f -p 8000 -h /www"]
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /openapi.json, port: 8000}, periodSeconds: 3}
          volumeMounts: [{name: specs, mountPath: /specs}]
      volumes: [{name: specs, configMap: {name: specs}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: billing, namespace: demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: billing}}
  template:
    metadata: {labels: {app: billing}}
    spec:
      containers:
        - name: httpd
          image: busybox:1.37
          command: [sh, -c, "mkdir -p /www && cp /specs/billing.json /www/openapi.json && cp /specs/invoices /www/invoices && exec httpd -f -p 8000 -h /www"]
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /openapi.json, port: 8000}, periodSeconds: 3}
          volumeMounts: [{name: specs, mountPath: /specs}]
      volumes: [{name: specs, configMap: {name: specs}}]
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: demo
  labels:
    swagger-aggregator.enable: "true"
  annotations:
    swagger-aggregator.group: shop
    swagger-aggregator.order: "1"
spec:
  selector: {app: orders}
  ports: [{name: http, port: 8080, targetPort: 8000}]
---
apiVersion: v1
kind: Service
metadata:
  name: billing
  namespace: demo
  labels:
    swagger-aggregator.enable: "true"
  annotations:
    swagger-aggregator.group: shop
    swagger-aggregator.order: "2"
    swagger-aggregator.name: Billing
spec:
  selector: {app: billing}
  ports: [{name: http, port: 8080, targetPort: 8000}]
---
# standard Ingress -> the public URL of "orders" is derived as https://orders.k8s.example.test
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: orders, namespace: demo}
spec:
  ingressClassName: traefik
  tls: [{hosts: [orders.k8s.example.test]}]
  rules:
    - host: orders.k8s.example.test
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: orders, port: {number: 8080}}}}
---
# Traefik IngressRoute -> the public URL of "billing" is derived as https://billing.k8s.example.test
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: billing, namespace: demo}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`billing.k8s.example.test`)
      kind: Rule
      services: [{name: billing, port: 8080}]
  tls: {}
