asyncapi: 3.1.0
info:
  title: Swagger Aggregator events
  version: 1.0.0
  description: |
    The live service list as **Server-Sent Events** over plain HTTP: `GET /api/events`.

    - On connect the server sends the **complete** list once, then again after **every visible change** (a service
      appears, disappears, goes up/down, gets a new spec, or changes group/order). Every message is a full snapshot, so
      a client simply replaces its list; there are no deltas to apply and nothing to resume after a reconnect.
    - A comment line `: heartbeat` every 15 seconds keeps idle reverse proxies from closing the connection. Comments carry
      no event; `EventSource` ignores them.
    - Use the browser's `EventSource`: it reconnects by itself. If authentication is on, the stream answers `401`, which
      makes `EventSource` stop; fall back to polling `GET /api/services` (see the OpenAPI document) and sign in again.
    - Scalar and other tools without SSE support show this as an HTTP channel; the wire format is the standard
      [SSE format](https://html.spec.whatwg.org/multipage/server-sent-events.html): `event: services`, then
      `data: <one line of JSON>`, then an empty line.

    ```js
    const es = new EventSource('/api/events')
    es.addEventListener('services', (e) => render(JSON.parse(e.data)))
    ```
defaultContentType: application/json
servers:
  web:
    host: localhost:3000
    protocol: http
    description: The origin that serves the UI (a reverse-proxy host and base path replace this).
channels:
  services:
    address: /api/events
    title: Service list
    description: |
      One long-lived `GET`. The response has `Content-Type: text/event-stream` and `Cache-Control: no-cache`;
      `X-Accel-Buffering: no` tells nginx not to buffer it.
    messages:
      servicesSnapshot:
        $ref: "#/components/messages/servicesSnapshot"
      heartbeat:
        $ref: "#/components/messages/heartbeat"
    bindings:
      http:
        method: GET
operations:
  receiveServices:
    action: receive
    channel: {$ref: "#/channels/services"}
    title: Receive the service list
    summary: Replace the local list with every `services` event.
    messages:
      - $ref: "#/channels/services/messages/servicesSnapshot"
      - $ref: "#/channels/services/messages/heartbeat"
components:
  messages:
    servicesSnapshot:
      name: services
      title: Service list snapshot
      summary: The complete list of discovered services.
      description: |
        SSE event `services`. Wire format:

        ```
        event: services
        data: [{"name":"orders","status":"up","specHash":"54efce3d897a6fb5"}]

        ```
      contentType: application/json
      payload: {$ref: "#/components/schemas/ServiceList"}
      examples:
        - name: two services
          payload:
            - {name: orders, status: up, lastSeen: "2026-10-24T17:40:04.489Z", specHash: 54efce3d897a6fb5}
            - {name: ghost, status: down, error: container is not attached to the network}
    heartbeat:
      name: heartbeat
      title: Heartbeat
      summary: A comment line every 15 seconds; not an event.
      description: |
        The line `: heartbeat` followed by an empty line. It has no `event:` and no `data:`, so `EventSource` does not
        deliver it to the application.
      contentType: text/plain
      payload: {type: "null", description: No payload.}
  schemas:
    ServiceList:
      type: array
      items: {$ref: "#/components/schemas/Service"}
    Service:
      type: object
      required: [name, status]
      properties:
        name: {type: string, description: "Display name and key for `GET /api/services/{name}/spec`."}
        status: {type: string, enum: [up, down]}
        lastSeen: {type: string, format: date-time, description: Last successful spec fetch.}
        specHash: {type: string, description: Hash of the current spec; absent until a spec was fetched.}
        error: {type: string, description: The last fetch or discovery problem.}
        group: {type: string}
        order: {type: integer}
