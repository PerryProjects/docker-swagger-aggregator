openapi: 3.1.0
info:
  title: Swagger Aggregator HTTP API
  version: 1.0.0
  summary: What a frontend talks to - the same interface the bundled UI uses.
  description: |
    `swagger-aggregator-web` serves the UI and forwards `/api/*` to the API server, so a frontend sees **one origin**.
    Use this interface to build your own frontend: list the documented services, read their OpenAPI specs, follow
    status changes live and (optionally) manage users.

    **Live updates** are a Server-Sent Events stream: see `GET /api/events`, which documents every event.

    **Authentication** depends on `SWAGGER_AGGREGATOR_WEB_AUTH`:
    - `none`: no authentication.
    - `build_in`: sign in with `POST /auth/login`; the session is an `HttpOnly` cookie. `/api/*` answers `401` without it.
      Browsers send the cookie automatically; across origins use `credentials: "include"` for `fetch` and
      `new EventSource(url, {withCredentials: true})` (see **A frontend on another origin**).
    - `oidc`: the browser is redirected to the identity provider (`/auth/login` is then a redirect, `/auth/session` etc. do not exist).

    ## A frontend on another origin

    The simplest is the same origin (point `--dir` of the web server at your build, or route your frontend and this
    interface to one host). A frontend on **another origin** needs the server's CORS list:
    `SWAGGER_AGGREGATOR_WEB_CORS_ORIGINS=https://app.example.com` (exact origins, comma separated, never `*`).
    For those origins the server answers with `Access-Control-Allow-Origin: <that origin>` and
    `Access-Control-Allow-Credentials: true`, and answers preflights itself (methods `GET, POST, PUT, PATCH, DELETE`,
    headers `Content-Type`, `Accept`, `If-None-Match`). The cookie is `SameSite=Lax`, which a frontend on the same
    *site* (e.g. `localhost:5173` and `localhost:3000`, or `app.example.com` and `docs.example.com`) can use. A frontend on
    another *site* needs `SWAGGER_AGGREGATOR_WEB_COOKIE_SAMESITE=none` (then the cookie is `Secure`: HTTPS or localhost).

    With a CORS list configured the server also refuses requests that change something (`POST`, `PUT`, `PATCH`,
    `DELETE`) with an `Origin` header that is neither listed nor its own: `403`. Requests without an `Origin` header
    (curl, other servers) are not browser requests and pass.

    The `/auth/*` operations below are those of `build_in`. The read-only **MCP** server for AI assistants lives at `/mcp`
    (JSON-RPC over Streamable HTTP, bearer token, only when enabled): see the **MCP** section.
  license:
    name: see the repository
    url: https://github.com/perryprojects/docker-swagger-aggregator
servers:
  - url: /
    description: The origin that serves the UI (a reverse-proxy base path such as /docs is prepended by the proxy).
tags:
  - name: Services
    description: The discovered services and their OpenAPI specs.
  - name: Events
    description: The live service list as Server-Sent Events.
  - name: Proxy
    description: Same-origin proxies used by "Try it".
  - name: MCP
    description: The read-only Model Context Protocol server for AI assistants (`SWAGGER_AGGREGATOR_WEB_MCP=true`).
  - name: Auth
    description: Sign in, sign out, first-run setup (auth=build_in).
  - name: Users
    description: User management (auth=build_in, admins only).
  - name: Meta
    description: Health and the document describing this API.
paths:
  /api/services:
    get:
      tags: [Services]
      operationId: listServices
      summary: List the discovered services
      description: Every service, including those that never delivered a spec (they have no `specHash` and usually an `error`).
      security: [{}, {cookieAuth: []}]
      responses:
        "200":
          description: The services, ordered by name.
          headers:
            Cache-Control: {schema: {type: string, const: no-cache}}
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Service"}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /api/services/{name}/spec:
    get:
      tags: [Services]
      operationId: getServiceSpec
      summary: Read the last known OpenAPI/Swagger spec of a service
      description: |
        Canonical JSON (keys sorted; YAML specs are converted). The server location inside it points at the same-origin
        proxy (`/api/proxy/{id}`) or at the service's `server-url`. The `ETag` is the spec hash from `listServices`:
        send it as `If-None-Match` to get `304`.
      security: [{}, {cookieAuth: []}]
      parameters:
        - name: name
          in: path
          required: true
          description: The service name from `listServices` (URL-encode it).
          schema: {type: string}
        - name: If-None-Match
          in: header
          schema: {type: string}
      responses:
        "200":
          description: The spec.
          headers:
            ETag: {schema: {type: string}, description: 'The spec hash in quotes, e.g. `"b795927e5b5fc9b8"`.'}
          content:
            application/json:
              schema: {type: object, description: An OpenAPI 3.x or Swagger 2.0 document.}
        "304": {description: Not modified (the `ETag` matches).}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404":
          description: Unknown service, or its spec has not been fetched yet.
          content:
            text/plain:
              schema: {type: string, examples: ["unknown service", "spec not fetched yet"]}
  /api/events:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: Follow the service list live (Server-Sent Events)
      description: |
        A long-lived `text/event-stream` (the standard
        [SSE format](https://html.spec.whatwg.org/multipage/server-sent-events.html)). It sends the **whole** service list
        whenever it is worth showing, so a client simply replaces its list: there are no deltas to apply and nothing to
        resume after a reconnect.

        ## Events

        | Event | `data` | When |
        |---|---|---|
        | `services` | a JSON array of [`Service`](#model/service): the complete list | once right after connecting, then after **every visible change**: a service appears or disappears, goes up or down, gets a new spec, changes its problem, group or order |
        | *(none)* | the comment line `: heartbeat` | every 15 seconds, so idle proxies keep the connection open |

        A comment line is not an event: `EventSource` ignores it, so the application never sees a heartbeat. A change that
        only moves `lastSeen` is not a visible change and sends nothing.

        ## On the wire

        ```
        event: services
        data: [{"name":"orders","status":"up","lastSeen":"2026-10-24T17:40:04.489Z","specHash":"54efce3d897a6fb5"}]

        : heartbeat

        event: services
        data: [{"name":"orders","status":"down","error":"unexpected status 503 Service Unavailable","specHash":"54efce3d897a6fb5"}]

        ```

        `data` is always one line of JSON. The response has `Cache-Control: no-cache` and `X-Accel-Buffering: no`
        (so that nginx does not buffer the stream).

        ## In the browser

        ```js
        const es = new EventSource('/api/events')   // reconnects by itself; sends the session cookie of the same origin
        es.addEventListener('services', (e) => render(JSON.parse(e.data)))
        ```

        With authentication on, an unauthenticated request answers `401`, which makes `EventSource` stop for good (it
        cannot read the status). A robust client therefore falls back to polling `GET /api/services` when the stream
        fails: a `401` there means "sign in again". Which service changed is not announced; compare the new list with
        the old one (the `specHash` tells whether a spec changed).
      security: [{}, {cookieAuth: []}]
      responses:
        "200":
          description: The event stream. It stays open until either side closes it.
          headers:
            Cache-Control: {schema: {type: string, const: no-cache}}
            X-Accel-Buffering: {schema: {type: string, const: "no"}}
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Blocks of `event: services` + `data: <JSON array of Service>`, separated by an empty line, and
                  `: heartbeat` comment lines.
              examples:
                afterConnecting:
                  summary: The first message after connecting
                  value: |+
                    event: services
                    data: [{"name":"Inventory","status":"up","lastSeen":"2026-10-24T17:40:04.484Z","specHash":"b795927e5b5fc9b8"},{"name":"orders","status":"up","lastSeen":"2026-10-24T17:40:04.489Z","specHash":"54efce3d897a6fb5"}]

                heartbeat:
                  summary: A heartbeat (a comment, not an event)
                  value: |+
                    : heartbeat

                serviceWentDown:
                  summary: A service went down
                  value: |+
                    event: services
                    data: [{"name":"Inventory","status":"up","specHash":"b795927e5b5fc9b8"},{"name":"orders","status":"down","error":"unexpected status 503 Service Unavailable","specHash":"54efce3d897a6fb5"}]

        "401": {$ref: "#/components/responses/Unauthenticated"}
  /api/proxy/{id}/{path}:
    parameters:
      - name: id
        in: path
        required: true
        description: The workload ID (container ID / Kubernetes UID) that the `servers` entry of a service's spec contains.
        schema: {type: string}
      - name: path
        in: path
        required: true
        description: The path below the service's base URL (may contain slashes).
        schema: {type: string}
    get:
      tags: [Proxy]
      operationId: proxyGet
      summary: Forward a request to a service
      description: |
        Used by "Try it": the browser calls the service through this origin (no CORS). The target is looked up by ID in
        the registry, never taken from the request. The request body is limited to 10 MiB; cookies, `Origin` and `Referer`
        are not forwarded. Every HTTP method is forwarded; they are listed separately only for the tools that need that.
      security: [{}, {cookieAuth: []}]
      responses:
        default:
          description: Whatever the service answers.
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404":
          description: Unknown or stopped service.
          content: {text/plain: {schema: {type: string, const: unknown or stopped service}}}
        "502":
          description: The service is unreachable.
          content: {text/plain: {schema: {type: string, const: upstream unreachable}}}
    post:
      tags: [Proxy]
      operationId: proxyPost
      summary: Forward a POST request to a service
      description: "Same as `GET`: the request is forwarded to the service (see there for the limits)."
      security: [{}, {cookieAuth: []}]
      responses:
        default:
          description: Whatever the service answers.
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404":
          description: Unknown or stopped service.
          content: {text/plain: {schema: {type: string, const: unknown or stopped service}}}
        "502":
          description: The service is unreachable.
          content: {text/plain: {schema: {type: string, const: upstream unreachable}}}
    put:
      tags: [Proxy]
      operationId: proxyPut
      summary: Forward a PUT request to a service
      description: "Same as `GET`: the request is forwarded to the service (see there for the limits)."
      security: [{}, {cookieAuth: []}]
      responses:
        default:
          description: Whatever the service answers.
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404":
          description: Unknown or stopped service.
          content: {text/plain: {schema: {type: string, const: unknown or stopped service}}}
        "502":
          description: The service is unreachable.
          content: {text/plain: {schema: {type: string, const: upstream unreachable}}}
    patch:
      tags: [Proxy]
      operationId: proxyPatch
      summary: Forward a PATCH request to a service
      description: "Same as `GET`: the request is forwarded to the service (see there for the limits)."
      security: [{}, {cookieAuth: []}]
      responses:
        default:
          description: Whatever the service answers.
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404":
          description: Unknown or stopped service.
          content: {text/plain: {schema: {type: string, const: unknown or stopped service}}}
        "502":
          description: The service is unreachable.
          content: {text/plain: {schema: {type: string, const: upstream unreachable}}}
    delete:
      tags: [Proxy]
      operationId: proxyDelete
      summary: Forward a DELETE request to a service
      description: "Same as `GET`: the request is forwarded to the service (see there for the limits)."
      security: [{}, {cookieAuth: []}]
      responses:
        default:
          description: Whatever the service answers.
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404":
          description: Unknown or stopped service.
          content: {text/plain: {schema: {type: string, const: unknown or stopped service}}}
        "502":
          description: The service is unreachable.
          content: {text/plain: {schema: {type: string, const: upstream unreachable}}}
  /api/scalar-proxy:
    get:
      tags: [Proxy]
      operationId: scalarProxy
      summary: Scalar's proxyUrl endpoint
      description: |
        Forwards a request to an absolute public URL that lies below a registered service's `server-url`. Only such URLs
        are accepted. Any HTTP method works.
      security: [{}, {cookieAuth: []}]
      parameters:
        - name: scalar_url
          in: query
          required: true
          schema: {type: string, format: uri}
      responses:
        default: {description: Whatever the service answers.}
        "400": {description: "`scalar_url` is not an http(s) URL."}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {description: No registered service for this URL.}
  /mcp:
    post:
      tags: [MCP]
      operationId: mcpCall
      summary: Call the MCP server (JSON-RPC 2.0)
      description: |
        A [Model Context Protocol](https://modelcontextprotocol.io) server over Streamable HTTP, **stateless** (no session,
        no `initialize` needed). It is **read-only**: it lets an AI assistant discover the documented services and read
        their specs, and it cannot call the services. Only present when the web server runs with
        `SWAGGER_AGGREGATOR_WEB_MCP=true`; the session login does not apply, the **bearer token** does
        (`SWAGGER_AGGREGATOR_WEB_MCP_TOKEN`, a shared secret: whoever has it can read all specs).

        Send one JSON-RPC request per `POST` with `Content-Type: application/json` and
        `Accept: application/json, text/event-stream` (without both, `400`). The answer is `text/event-stream` with one
        `message` event whose `data` is the JSON-RPC response. `GET` and `DELETE` answer `405`.
        Use the `tools/list` method to discover the tools and `tools/call` to run one.

        ## Tools

        | Tool | Arguments | Returns (`structuredContent`) |
        |---|---|---|
        | `list_services` | none | `{services: [{name, status, group?, hasSpec, problem?}]}`: start here |
        | `list_endpoints` | `service` | `{endpoints: [{method, path, summary?, operationId?, tags?}]}`: cheaper than the whole spec |
        | `search_endpoints` | `query`, `limit?` (default 25, at most 100) | `{matches: [{service, method, path, ...}], truncated?, unavailable?}`: case-insensitive, over name, path, summary, description, operationId and tags |
        | `get_spec` | `service` | the complete spec as JSON **text** (it can be large) |

        A failed tool call is not an HTTP error: the result has `isError: true` and a message in `content[0].text`
        (for example `unknown service "x": call list_services for the names`).

        ## Using it from an assistant

        ```
        claude mcp add --transport http swagger-aggregator https://docs.example.com/mcp \
          --header "Authorization: Bearer <token>"
        ```
      security: [{bearerAuth: []}]
      parameters:
        - name: Accept
          in: header
          required: true
          description: Must list both media types.
          schema: {type: string, const: "application/json, text/event-stream"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JsonRpcRequest"}
            examples:
              listTools:
                summary: Discover the tools
                value: {jsonrpc: "2.0", id: 1, method: tools/list}
              listServices:
                summary: List the services
                value: {jsonrpc: "2.0", id: 2, method: tools/call, params: {name: list_services, arguments: {}}}
              listEndpoints:
                summary: List the operations of one service
                value: {jsonrpc: "2.0", id: 3, method: tools/call, params: {name: list_endpoints, arguments: {service: orders}}}
              searchEndpoints:
                summary: Search all services
                value: {jsonrpc: "2.0", id: 4, method: tools/call, params: {name: search_endpoints, arguments: {query: invoice, limit: 10}}}
              getSpec:
                summary: Read a whole spec
                value: {jsonrpc: "2.0", id: 5, method: tools/call, params: {name: get_spec, arguments: {service: orders}}}
      responses:
        "200":
          description: One `message` event with the JSON-RPC response.
          content:
            text/event-stream:
              schema:
                type: string
                description: "`event: message`, then `data:` with a JSON-RPC response (see `JsonRpcResponse`)."
              examples:
                listServicesResult:
                  summary: Result of list_services
                  value: |+
                    event: message
                    data: {"jsonrpc":"2.0","id":2,"result":{"content":[{"type":"text","text":"{\"services\":[{\"hasSpec\":true,\"name\":\"orders\",\"status\":\"up\"}]}"}],"structuredContent":{"services":[{"hasSpec":true,"name":"orders","status":"up"}]}}}

                toolError:
                  summary: A failed tool call
                  value: |+
                    event: message
                    data: {"jsonrpc":"2.0","id":5,"result":{"content":[{"type":"text","text":"unknown service \"nope\": call list_services for the names"}],"isError":true}}

        "400":
          description: Malformed request, or the `Accept` header lacks one of the two media types.
          content: {text/plain: {schema: {type: string}}}
        "401":
          description: Missing or wrong bearer token.
          headers:
            WWW-Authenticate: {schema: {type: string, const: 'Bearer realm="swagger-aggregator"'}}
          content: {text/plain: {schema: {type: string, const: unauthorized}}}
        "405": {description: "Only `POST` is allowed (the server is stateless: no stream to open, no session to close)."}
  /healthz:
    get:
      tags: [Meta]
      operationId: health
      summary: Liveness probe
      description: Always public, also with authentication enabled.
      security: []
      responses:
        "200":
          description: Alive.
          content: {text/plain: {schema: {type: string, const: ok}}}
  /spec/openapi.json:
    get:
      tags: [Meta]
      operationId: getOpenAPI
      summary: This document (JSON)
      security: []
      responses:
        "200": {description: This OpenAPI document., content: {application/json: {schema: {type: object}}}}
  /spec/openapi.yaml:
    get:
      tags: [Meta]
      operationId: getOpenAPIYAML
      summary: This document (YAML)
      security: []
      responses:
        "200": {description: This OpenAPI document., content: {application/yaml: {schema: {type: string}}}}
  /auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Which authentication is active and who is signed in
      description: Always answers `200`. A frontend calls it first to decide between the login form, the setup form and the app.
      security: []
      responses:
        "200":
          description: The session state.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionInfo"}
              examples:
                signedOut: {value: {mode: build_in, setupRequired: false}}
                signedIn: {value: {mode: build_in, setupRequired: false, user: {id: 1, username: admin, role: admin, disabled: false}}}
                newInstance: {value: {mode: build_in, setupRequired: true}}
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in
      description: |
        Sets the session cookie. A failed attempt delays the next attempt for that username (1 s, 2 s, ... up to 30 s):
        during the delay even the right password gets `429` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Credentials"}
      responses:
        "200":
          description: Signed in. The `Set-Cookie` header carries the session.
          headers:
            Set-Cookie: {schema: {type: string}, description: "`swagger_aggregator_session`, HttpOnly, SameSite=Lax (Secure over HTTPS)."}
          content:
            application/json:
              schema: {type: object, required: [user], properties: {user: {$ref: "#/components/schemas/User"}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {description: Wrong username or password (also for unknown or disabled users)., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "415": {$ref: "#/components/responses/NotJSON"}
        "429": {$ref: "#/components/responses/TooManyAttempts"}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out
      description: Clears the session cookie (this browser only).
      security: []
      responses:
        "204": {description: Signed out.}
  /auth/setup:
    post:
      tags: [Auth]
      operationId: setup
      summary: Register the first admin
      description: |
        Only while the instance has no users. Needs the setup token that is printed in the log at startup (or set with
        `SWAGGER_AGGREGATOR_WEB_SETUP_TOKEN`). Signs the new admin in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/Credentials"}
                - type: object
                  required: [token]
                  properties:
                    token: {type: string, description: The setup token.}
      responses:
        "201":
          description: The admin was created and is signed in.
          content:
            application/json:
              schema: {type: object, required: [user], properties: {user: {$ref: "#/components/schemas/User"}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {description: Wrong setup token., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: The instance has users already., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "415": {$ref: "#/components/responses/NotJSON"}
        "429": {$ref: "#/components/responses/TooManyAttempts"}
  /auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the own password
      description: Ends all other sessions of the user; the calling browser gets a fresh one.
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, new]
              properties:
                current: {type: string}
                new: {type: string, minLength: 10, maxLength: 72}
      responses:
        "204": {description: Changed.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {description: The current password is wrong., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "415": {$ref: "#/components/responses/NotJSON"}
  /auth/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List the users
      security: [{cookieAuth: []}]
      responses:
        "200":
          description: All users ordered by name.
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/User"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/AdminOnly"}
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/Credentials"}
                - type: object
                  properties:
                    role: {$ref: "#/components/schemas/Role"}
      responses:
        "201": {description: Created., content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/AdminOnly"}
        "409": {description: The username is taken., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "415": {$ref: "#/components/responses/NotJSON"}
  /auth/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Change a user
      description: |
        Any of password, role and disabled. A new password, a disabled user or a changed role ends that user's sessions.
        The last active admin cannot be demoted or disabled.
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: {type: string, minLength: 10, maxLength: 72}
                role: {$ref: "#/components/schemas/Role"}
                disabled: {type: boolean}
      responses:
        "200": {description: Updated., content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/AdminOnly"}
        "404": {description: Unknown user., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: This would leave no active admin., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "415": {$ref: "#/components/responses/NotJSON"}
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a user
      description: Not yourself, and not the last active admin.
      security: [{cookieAuth: []}]
      responses:
        "204": {description: Deleted.}
        "400": {description: You cannot delete yourself or the id is malformed., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/AdminOnly"}
        "404": {description: Unknown user., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: This would leave no active admin., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: swagger_aggregator_session
      description: The session cookie set by `login` / `setup` (auth=build_in) or by the OpenID Connect login (auth=oidc).
    bearerAuth:
      type: http
      scheme: bearer
      description: The shared secret `SWAGGER_AGGREGATOR_WEB_MCP_TOKEN` (at least 32 characters). Only `/mcp` uses it.
  schemas:
    JsonRpcRequest:
      type: object
      required: [jsonrpc, id, method]
      properties:
        jsonrpc: {type: string, const: "2.0"}
        id: {type: [integer, string], description: Echoed in the response.}
        method:
          type: string
          enum: [tools/list, tools/call]
          description: "`tools/list` discovers the tools, `tools/call` runs one."
        params:
          type: object
          description: For `tools/call`.
          required: [name]
          properties:
            name: {type: string, enum: [list_services, list_endpoints, search_endpoints, get_spec]}
            arguments: {type: object, description: "The tool's arguments, see the table above."}
    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc: {type: string, const: "2.0"}
        id: {type: [integer, string]}
        result:
          type: object
          properties:
            content:
              type: array
              description: The result as text (JSON for the structured tools).
              items: {type: object, properties: {type: {type: string, const: text}, text: {type: string}}}
            structuredContent: {type: object, description: "The same result as an object, for the tools that have a schema."}
            isError: {type: boolean, description: "true: the tool failed; `content[0].text` says why."}
        error: {type: object, description: A JSON-RPC protocol error (unknown method, invalid arguments)., properties: {code: {type: integer}, message: {type: string}}}
    Service:
      type: object
      required: [name, status]
      properties:
        name: {type: string, description: Display name and key for the other operations., examples: [orders]}
        status:
          type: string
          enum: [up, down]
          description: "`up` only if the workload runs, its health check (if any) is healthy and the spec could be fetched."
        lastSeen: {type: string, format: date-time, description: Last successful spec fetch.}
        specHash: {type: string, description: Hash of the current spec; absent until a spec was fetched. Equals the spec's ETag.}
        error: {type: string, description: The last fetch or discovery problem.}
        group: {type: string, description: Optional group label.}
        order: {type: integer, description: Optional sort key inside a group.}
    SessionInfo:
      type: object
      required: [mode, setupRequired]
      properties:
        mode: {type: string, const: build_in}
        setupRequired: {type: boolean, description: "True while there is no user: show the setup form." }
        user: {$ref: "#/components/schemas/User"}
    User:
      type: object
      required: [id, username, role, disabled]
      properties:
        id: {type: integer}
        username: {type: string, description: Lower case.}
        role: {$ref: "#/components/schemas/Role"}
        disabled: {type: boolean}
    Role:
      type: string
      enum: [admin, user]
      description: "`admin` manages users, `user` reads the documentation."
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$", description: Case-insensitive; stored lower case.}
        password: {type: string, minLength: 10, maxLength: 72}
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
  responses:
    Unauthenticated:
      description: No valid session.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: unauthenticated}
    AdminOnly:
      description: The user is not an admin.
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    BadRequest:
      description: Invalid input; the message says which field.
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    NotJSON:
      description: The content type must be `application/json`.
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    TooManyAttempts:
      description: Failed attempts are delayed.
      headers:
        Retry-After: {schema: {type: integer}, description: Seconds to wait.}
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
