# A syntactically valid kubeconfig that points nowhere; it is only parsed, never contacted.
apiVersion: v1
kind: Config
current-context: test
clusters:
  - name: test
    cluster: {server: "https://127.0.0.1:1"}
users:
  - name: test
    user: {token: "not-a-real-token"}
contexts:
  - name: test
    context: {cluster: test, user: test}
